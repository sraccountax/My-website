<VirtualHost *:80>
  ServerName gate.test
  ServerAlias books-test.sraccountax.ca
  DocumentRoot /srv/gate/www
  <Directory /srv/gate/www>
    AllowOverride All
    Require all granted
  </Directory>
  <FilesMatch "\.php$">
    SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
  </FilesMatch>
  ErrorLog /srv/gate/apache-error.log
  CustomLog /srv/gate/apache-access.log combined
</VirtualHost>
<VirtualHost *:443>
  ServerName gate.test
  ServerAlias books-test.sraccountax.ca
  DocumentRoot /srv/gate/www
  SSLEngine on
  SSLCertificateFile /srv/gate/pki/srv.crt
  SSLCertificateKeyFile /srv/gate/pki/srv.key
  <Directory /srv/gate/www>
    AllowOverride All
    Require all granted
  </Directory>
  <FilesMatch "\.php$">
    SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
  </FilesMatch>
  ErrorLog /srv/gate/apache-error.log
  CustomLog /srv/gate/apache-access.log combined
</VirtualHost>
